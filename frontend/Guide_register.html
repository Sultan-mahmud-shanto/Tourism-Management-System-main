<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register </title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="shortcut icon" href="T.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <style>
     body{
        background-image: url(Guide.webp);
    }
    .wrapper2{
    width: 420px;
    background: transparent;
    background-color: rgb(47, 81, 70);
    border: 2px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(9px);
    color: #fff;
    border-radius: 12px;
    padding: 30px 40px;
  }
  .wrapper2 h1{
    font-size: 36px;
    text-align: center;
  }
  .wrapper2 .input-box{
    position: relative;
    width: 100%;
    height: 50px;
    
    margin: 30px 0;
  }
 

  .wrapper2 .remember-forgot{
    display: flex;
    justify-content: space-between;
    font-size: 14.5px;
    margin: -15px 0 15px;
  }



  .wrapper2 .btn{
    width: 100%;
    height: 45px;
    background: #fff;
    border: none;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    cursor: pointer;
    font-size: 16px;
    color: #333;
    font-weight: 600;
  }
  .wrapper2 .register-link{
    font-size: 14.5px;
    text-align: center;
    margin: 20px 0 15px;
  
  }
  </style>
</head>
<body>
  <div class="wrapper2">
    <form action="Guide_register_handler.php" method="POST">
      <h1>Guide Register</h1>
      
      <!-- <div class="input-box">
        <input type="text" name="tourist_id" placeholder="Tourist ID" required>
        <i class='bx bxs-id-card'></i>
      </div> -->
      <div class="input-box">
        <input type="text" name="Guide_name" placeholder="Guide Name" required>
        <i class='bx bxs-user'></i>
      </div>
     
      <div class="input-box">
        <select name="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <i class='bx bxs-user-circle'></i>
      </div>
      <div class="input-box">
        <input type="tel" name="phone_number" placeholder="Phone Number" required>
        <i class='bx bxs-phone'></i>
      </div>
      <div class="input-box">
        <input type="number" name="year_of_experience" placeholder="Year of Experience" >
        
      </div>
      <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
        <i class='bx bxs-user-detail'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <i class='bx bxs-lock'></i>
      </div>

      <button type="submit" class="btn">Register</button>
      
      <div class="login-link">
        <br><p>Already have an account? <a href="Guide_index.html">Login</a></p>
      </div>
    </form>
  </div>
</body>
</html>
