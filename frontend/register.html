<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Dan Aleko</title>
  <link rel="stylesheet" href="style/style.css">
  <link rel="shortcut icon" href="T.png">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <div class="wrapper">
    <form action="register_handler.php" method="POST">
      <h1>Register</h1>
      
      <!-- <div class="input-box">
        <input type="text" name="tourist_id" placeholder="Tourist ID" required>
        <i class='bx bxs-id-card'></i>
      </div> -->
      <div class="input-box">
        <input type="text" name="tourist_name" placeholder="Tourist Name" required>
        <i class='bx bxs-user'></i>
      </div>
      <div class="input-box">
        <input type="text" name="country" placeholder="Country" required>
        <i class='bx bxs-flag'></i>
      </div>
      <div class="input-box">
        <select name="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <i class='bx bxs-user-circle'></i>
      </div>
      <div class="input-box">
        <input type="tel" name="phone_number" placeholder="Phone Number" required>
        <i class='bx bxs-phone'></i>
      </div>
      <div class="input-box">
        <input type="number" name="age" placeholder="Age" required min="1">
        <i class='bx bxs-calendar'></i>
      </div>
      <div class="input-box">
        <input type="text" name="username" placeholder="Username" required>
        <i class='bx bxs-user-detail'></i>
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
      </div>
      <div class="input-box">
        <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        <i class='bx bxs-lock'></i>
      </div>

      <button type="submit" class="btn">Register</button>
      
      <div class="login-link">
        <p>Already have an account? <a href="index.html">Login</a></p>
      </div>
    </form>
  </div>
</body>
</html>
